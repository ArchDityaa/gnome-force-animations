# Managed by gnome-force-animations.
#
# Forces GNOME Shell to keep desktop animations enabled even when the renderer
# is not hardware accelerated (llvmpipe / software rendering).
#
# This drop-in is installed for both the Wayland and X11 GNOME Shell systemd
# user services. It is entirely user-scoped, no root is required.
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-shell --force-animations
